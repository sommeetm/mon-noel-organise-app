name: Actualiser le catalogue et publier sur GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/actualiser_catalogue.py"
      - ".github/workflows/actualiser-catalogue.yml"
      - "index.html"
      - "style.css"
      - "app.js"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "mon-noel-organise-catalogue"
  cancel-in-progress: false

jobs:
  actualiser-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exécuter le script d'actualisation du catalogue
        run: python scripts/actualiser_catalogue.py

      - name: Valider la syntaxe JSON du catalogue
        run: python -c "import json; d=json.load(open('catalogue.json', encoding='utf-8')); assert isinstance(d.get('products'), list) and len(d['products']) > 0"

      - name: Enregistrer catalogue.json si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalogue): actualisation du catalogue français"
            git push
          else
            echo "Aucun changement détecté dans catalogue.json."
          fi

  deploy-pages:
    needs: actualiser-catalogue
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact statique (sans scripts ni .git)
        run: |
          mkdir -p _site
          cp index.html style.css app.js catalogue.json LISEZ-MOI.txt _site/

      - name: Charger l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
