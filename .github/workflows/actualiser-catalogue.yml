name: Actualisation du catalogue Noël

on:
  schedule:
    # Exécution automatique tous les lundis à 06h00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permet un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du script d'actualisation
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scripts/actualiser_catalogue.py

      - name: Vérification et publication des modifications
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add catalogue.json scripts/images_cache.json
          if git diff --staged --quiet; then
            echo "Aucune modification détectée dans catalogue.json ou scripts/images_cache.json."
          else
            git commit -m "chore: actualisation automatique du catalogue et du cache images"
            git push
          fi
